name: TryHackMe pixel badge
description: Render a pixel-art TryHackMe profile badge (PNG, animated GIF, CSS spritesheet) into your repo.
author: napahlm
branding:
  icon: shield
  color: orange

inputs:
  username:
    description: TryHackMe username
    required: true
  theme:
    description: Theme name (adventure, famicom, bloodmoon, nord, retrowave, retropc, gameboy, commodore, dungeon, ocean)
    default: adventure
  mode:
    description: light, dark or both
    default: both
  scale:
    description: Integer upscale factor
    default: "2"
  animate:
    description: Also write the animated GIF, spritesheet and CSS
    default: "true"
  frame:
    description: Outer frame style (risen, sunken, normal, blackBorder)
    default: risen
  out_dir:
    description: Directory in your repo to write the badge files to
    default: badges
  extra_args:
    description: Extra flags passed to thm_badge.py (for example --no-avatar)
    default: ""
  commit:
    description: Commit and push the output
    default: "true"
  commit_message:
    description: Commit message used when the badge changed
    default: "update(badge): tryhackme stats"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: |
        pip install --quiet pillow playwright
        python -m playwright install --with-deps chromium

    - name: Render badge
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        THM_USERNAME: ${{ inputs.username }}
        THM_THEME: ${{ inputs.theme }}
        THM_MODE: ${{ inputs.mode }}
        THM_SCALE: ${{ inputs.scale }}
        THM_ANIMATE: ${{ inputs.animate }}
        THM_FRAME: ${{ inputs.frame }}
        THM_OUT: ${{ inputs.out_dir }}
        THM_EXTRA_ARGS: ${{ inputs.extra_args }}
        SPRITE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ inputs.out_dir }}/thm-${{ inputs.theme }}-dark-sprite.png
      run: |
        ANIM=""; [ "$THM_ANIMATE" = "true" ] && ANIM="--animate"
        python "$ACTION_PATH/thm_badge.py" --username "$THM_USERNAME" \
          --theme "$THM_THEME" --mode "$THM_MODE" --scale "$THM_SCALE" --frame "$THM_FRAME" \
          --out "$THM_OUT" --sprite-url "$SPRITE_URL" $ANIM $THM_EXTRA_ARGS

    - name: Commit if changed
      if: inputs.commit == 'true'
      shell: bash
      env:
        THM_OUT: ${{ inputs.out_dir }}
        MSG: ${{ inputs.commit_message }}
      run: |
        git config user.name "thm-badge-bot"
        git config user.email "thm-badge-bot@users.noreply.github.com"
        git add "$THM_OUT"
        if git diff --cached --quiet; then
          echo "Badge unchanged, nothing to commit."
        else
          git commit -m "$MSG $(date -u +%Y-%m-%d)"
          git push
        fi